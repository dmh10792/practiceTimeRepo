spring:
  application:
    name: need-to-know-app
  datasource:
    url: jdbc:postgresql://localhost:5432/experiment-db
    username: experiment
    password: experiment
    driver-class-name: org.postgresql.Driver
    connectionProperties:
      sslFactory: org.postgresql.ssl.DefaultJavaSSLFactory

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

management:
  # The metrics signal lives on the SAME port as the app (8080) in this lab to keep the Kubernetes Service simple. 
  # The metrics endpoint is /actuator/prometheus.
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      # A stable application tag so dashboards can group by app without relying solely on Kubernetes pod labels.
      application: need-to-know-app
    distribution:
      # Emit histogram buckets so histogram_quantile() works for p95 latency.
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    # Structure to make logs that are easy to read in Loki.
    console: "%d{dd-MMM-yy HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
