services:

  postgres-db-experiment:
    container_name: postgres-experiment
    image: postgres:17 # use latest official postgres version
    restart: always
    environment:
      POSTGRES_USER: experiment
      POSTGRES_PASSWORD: experiment
      POSTGRES_DB: experiment-db
    ports:
      - "5432:5432"

  app:
    container_name: need-to-know
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: experiment
      SPRING_DATASOURCE_PASSWORD: experiment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db-experiment:5432/experiment-db
    ports:
      - "8080:8080"
