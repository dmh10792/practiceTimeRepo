apiVersion: apps/v1
kind: Deployment
metadata:
  name: need-to-know-app-deployment
  namespace: need-to-know
  labels:
    app: need-to-know-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: need-to-know-app
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: need-to-know-app
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: need-to-know
        image: need-to-know:1.0.0
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 1000m
            memory: 100M
          requests:
            cpu: 10m
            memory: 10M
